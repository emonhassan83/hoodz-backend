name: hoodz-backend

services:
  redis:
    image: redis:7-alpine
    container_name: hoodz_backend_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-myStrongRedisPassword}
    expose:
      - "6379"
    ports:
      - "127.0.0.1:6408:6379"
    volumes:
      - redis_data:/data
    networks:
      - hoodz_backend_net

  typesense:
    image: typesense/typesense:27.1
    container_name: hoodz_backend_typesense
    restart: unless-stopped
    command: >
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY:-hoodzTypesenseAdminKey}
      --enable-cors
    expose:
      - "8108"
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense_data:/data
    networks:
      - hoodz_backend_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: hoodz_backend_server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-myStrongRedisPassword}
      REDIS_PORT: 6379
      TYPESENSE_ENABLED: ${TYPESENSE_ENABLED:-true}
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-hoodzTypesenseAdminKey}
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./server/src:/usr/src/app/src
    depends_on:
      redis:
        condition: service_started
      typesense:
        condition: service_started
    networks:
      - hoodz_backend_net

volumes:
  redis_data:
  typesense_data:

networks:
  hoodz_backend_net:
    name: hoodz_backend_net
